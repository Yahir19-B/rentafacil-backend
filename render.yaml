databases:
  - name: rentafacil-db
    plan: free
    databaseName: rentafacil
    user: rentafacil

services:
  - type: web
    name: rentafacil-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/categorias
    envVars:
      - key: APP_NAME
        value: RentaFacil
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: 120
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: rentafacil-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rentafacil-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rentafacil-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rentafacil-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rentafacil-db
          property: password
      - key: APP_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: MODERACION_IA_ACTIVA
        sync: false
      - key: LOGO_EMAIL_URL
        sync: false
